[project]
name = "patchcore"
version = "0.1.0"
description = "Tory's patchcore impl."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faiss-gpu-cu12>=1.13.2",
    "matplotlib>=3.10.8",
    "opencv-python>=4.12.0.88",
    "polars>=1.37.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "tqdm>=4.67.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
torchvision = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
